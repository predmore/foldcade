name: Unit tests

# pull_request runs are read-only for the Gradle cache. push to main writes it.
on:
  pull_request:
  push:
    branches:
      - main

# Cancel a stale pull-request run when a new push arrives.
# Push to main does not cancel. The release workflow also keeps cancel-in-progress false.
concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: versionCode
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check versionName
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/release/check-version-bump.sh

  test:
    name: testDebugUnitTest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK root
        id: sdk
        run: echo "root=$HOME/android-sdk" >> "$GITHUB_OUTPUT"

      - name: Cache Android SDK packages
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/cmdline-tools
            ${{ steps.sdk.outputs.root }}/platforms
            ${{ steps.sdk.outputs.root }}/build-tools
            ${{ steps.sdk.outputs.root }}/platform-tools
            ${{ steps.sdk.outputs.root }}/licenses
          key: android-sdk-33-37.0-build-tools-37.0.0-platform-tools-v1

      - name: Install Android SDK packages
        env:
          SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p "$SDK_ROOT"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/cmdlinetools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            unzip -q "$tmp/cmdlinetools.zip" -d "$tmp"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$tmp/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          sdkmanager="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # sdkmanager closes stdin, so `yes` exits 141. Licenses are still accepted.
          yes | "$sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          # Do not install the legacy `tools` package. Current cmdline-tools do not ship it.
          # compileSdk is release(37), so compilation needs platforms;android-37.0.
          # platforms;android-33 is the min and target platform.
          "$sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-33" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --configuration-cache
