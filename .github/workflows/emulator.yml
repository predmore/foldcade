name: Thor-sized emulator

# Separate from unit tests. Pull requests only.
# Docs-only pulls skip the boot. The result job still succeeds so this check
# can be required later without leaving path-skipped runs pending.
# A green run is a Thor-sized emulator pass. It is not a Thor pass.
on:
  pull_request:

# Per pull request. A new push cancels the stale run.
# cancel-in-progress stays true only here and on the unit-test pull-request job.
# The release workflow keeps cancel-in-progress false.
concurrency:
  group: emulator-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: paths
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Shell, player, or test paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt"
          pattern='^(app/|api/|language/|plugins/|gradle/)|^\.github/workflows/emulator\.yml$|^\.github/emulator/|(^|/)src/test/|(^|/)src/androidTest/|^gradlew$|^gradlew\.bat$|^build\.gradle\.kts$|^settings\.gradle\.kts$|^gradle\.properties$'
          if grep -Eq "$pattern" "$RUNNER_TEMP/changed.txt"; then
            echo "shell=true" >> "$GITHUB_OUTPUT"
          else
            echo "shell=false" >> "$GITHUB_OUTPUT"
          fi

  screenshots:
    name: Thor-sized emulator, not a Thor pass
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-24.04
    # Boot is capped in the script. This is the whole job, including the SDK install.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK root
        id: sdk
        run: echo "root=$HOME/android-sdk" >> "$GITHUB_OUTPUT"

      - name: Cache Android SDK and system image
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/cmdline-tools
            ${{ steps.sdk.outputs.root }}/platforms
            ${{ steps.sdk.outputs.root }}/build-tools
            ${{ steps.sdk.outputs.root }}/platform-tools
            ${{ steps.sdk.outputs.root }}/emulator
            ${{ steps.sdk.outputs.root }}/system-images
            ${{ steps.sdk.outputs.root }}/licenses
          key: android-emulator-api33-google-apis-x86_64-build-tools-37.0.0-v1

      - name: Install Android SDK packages
        env:
          SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p "$SDK_ROOT"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/cmdlinetools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            unzip -q "$tmp/cmdlinetools.zip" -d "$tmp"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$tmp/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          sdkmanager="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # sdkmanager closes stdin, so `yes` exits 141. Licenses are still accepted.
          yes | "$sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          # Do not install the legacy `tools` package. Current cmdline-tools do not ship it.
          # compileSdk is release(37), so compilation needs platforms;android-37.0.
          # platforms;android-33 is the min and target platform.
          "$sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-33" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-33;google_apis;x86_64"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Render home music
        uses: ./.github/actions/render-home-music

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --configuration-cache

      - name: Emulator packages
        run: |
          set -euo pipefail
          sudo apt-get update
          audio=""
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            audio=libasound2t64
          elif apt-cache show libasound2 >/dev/null 2>&1; then
            audio=libasound2
          fi
          # Qt 6's xcb plugin exits immediately when these are missing, and the
          # script then used to sit in adb wait-for-device until the job timeout.
          # qemu 37.2.12 NEEDs libpulse.so.0 even with -no-audio. Run 37884626225
          # exited at boot with "libpulse.so.0: cannot open shared object file".
          sudo apt-get install -y \
            xvfb libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libegl1 \
            libpulse0 libx11-6 \
            ${audio:+"$audio"}
          qemu="${ANDROID_HOME:-$HOME/android-sdk}/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          if [ -x "$qemu" ]; then
            missing="$(LD_LIBRARY_PATH="${ANDROID_HOME:-$HOME/android-sdk}/emulator/lib64:${ANDROID_HOME:-$HOME/android-sdk}/emulator/lib64/qt/lib" \
              ldd "$qemu" | awk '/not found/ { print }' || true)"
            if [ -n "$missing" ]; then
              echo "::error::The emulator binary is still missing shared libraries."
              printf '%s\n' "$missing"
              exit 1
            fi
          fi

      - name: Dual-screen screenshots
        timeout-minutes: 15
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          bash .github/emulator/dual-screen.sh screenshots

      - name: Upload both displays
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dual-screen-displays
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the emulator log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-log
          path: |
            screenshots/emulator.log
            screenshots/logcat.txt
            screenshots/failure.txt
          if-no-files-found: ignore
          retention-days: 7

  result:
    name: emulator result
    needs: [changes, screenshots]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Succeed when the emulator was skipped or passed
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          screenshots="${{ needs.screenshots.result }}"
          if [ "$changes" != "success" ]; then
            echo "::error::Path check result is ${changes}."
            exit 1
          fi
          case "$screenshots" in
            success|skipped) exit 0 ;;
          esac
          echo "::error::Emulator result is ${screenshots}."
          exit 1
