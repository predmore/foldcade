name: Thor-sized emulator

# Separate from unit tests. Pull requests, a nightly run on main, and a
# manual run of that same workflow. Docs-only pulls skip the boot. The result
# job still succeeds so this check can be required later without leaving
# path-skipped runs pending.
# A green run is a Thor-sized emulator pass. It is not a Thor pass.
on:
  pull_request:
  schedule:
    # GitHub runs this only from the default branch, which is main.
    - cron: "0 8 * * *"
  workflow_dispatch:

# Per pull request. A new push cancels the stale run.
# Schedule and workflow_dispatch have no pull request number, so the group
# falls back to github.ref (refs/heads/main when the run is against main).
# cancel-in-progress stays true only here and on the unit-test pull-request job.
# The release workflow keeps cancel-in-progress false.
concurrency:
  group: emulator-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: paths
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}

      - name: Shell, player, or test paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Schedule and workflow_dispatch have no pull request base SHA.
          # Skip the diff and always boot so the nightly run cannot no-op.
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "shell=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt"
          pattern='^(app/|api/|language/|plugins/|gradle/)|^\.github/workflows/emulator\.yml$|^\.github/emulator/|(^|/)src/test/|(^|/)src/androidTest/|^gradlew$|^gradlew\.bat$|^build\.gradle\.kts$|^settings\.gradle\.kts$|^gradle\.properties$'
          if grep -Eq "$pattern" "$RUNNER_TEMP/changed.txt"; then
            echo "shell=true" >> "$GITHUB_OUTPUT"
          else
            echo "shell=false" >> "$GITHUB_OUTPUT"
          fi

  screenshots:
    name: Thor-sized emulator, not a Thor pass (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-24.04
    # Two emulators in parallel, each running half the captures (FOLDCADE_SHARD in
    # dual-screen.sh). Each job boots its own emulator, so neither waits on the other.
    strategy:
      fail-fast: false
      matrix:
        shard: [shell, library]
    # Boot is capped in the script. This is the whole job, including the SDK install.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK root
        id: sdk
        run: echo "root=$HOME/android-sdk" >> "$GITHUB_OUTPUT"

      # Restore only. A pull request saving its own 2 GB copy under refs/pull/N/merge
      # could not be read by any other pull request, and those copies pushed the
      # repository past the 10 GB cache limit, so main's copy was evicted and every
      # run reinstalled the SDK. Only main saves (see the step after the install).
      - name: Restore Android SDK and system image
        id: sdk-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/cmdline-tools
            ${{ steps.sdk.outputs.root }}/platforms
            ${{ steps.sdk.outputs.root }}/build-tools
            ${{ steps.sdk.outputs.root }}/platform-tools
            ${{ steps.sdk.outputs.root }}/emulator
            ${{ steps.sdk.outputs.root }}/system-images
            ${{ steps.sdk.outputs.root }}/licenses
          key: android-emulator-api33-google-apis-x86_64-build-tools-37.0.0-v1

      - name: Install Android SDK packages
        env:
          SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p "$SDK_ROOT"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/cmdlinetools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            unzip -q "$tmp/cmdlinetools.zip" -d "$tmp"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$tmp/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          sdkmanager="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # sdkmanager closes stdin, so `yes` exits 141. Licenses are still accepted.
          yes | "$sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          # Do not install the legacy `tools` package. Current cmdline-tools do not ship it.
          # compileSdk is release(37), so compilation needs platforms;android-37.0.
          # platforms;android-33 is the min and target platform.
          # Run 37974211589 downloaded a truncated emulator zip. sdkmanager then
          # failed with "Error on ZipFile unknown archive" and the job never
          # reached the Thor-sized capture. Drop that partial package and retry.
          install_packages() {
            "$sdkmanager" --sdk_root="$SDK_ROOT" --install \
              "platforms;android-33" \
              "platforms;android-37.0" \
              "build-tools;37.0.0" \
              "platform-tools" \
              "emulator" \
              "system-images;android-33;google_apis;x86_64" \
              || return 1
            test -x "$SDK_ROOT/emulator/emulator"
          }
          installed=0
          for attempt in 1 2 3; do
            if install_packages; then
              installed=1
              break
            fi
            echo "SDK install failed on attempt ${attempt}."
            rm -rf "$SDK_ROOT/emulator" "$SDK_ROOT/.temp" "$SDK_ROOT/.downloadIntermediates"
            find "$SDK_ROOT" "$HOME/.android" -iname '*emulator*.zip' -delete 2>/dev/null || true
            sleep $((attempt * 5))
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::Android SDK packages did not install."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      # Saved before the emulator runs, so a failed capture still warms the cache.
      # The nightly run and a manual run on main write it. Pull requests read it.
      - name: Save Android SDK and system image
        if: github.ref == 'refs/heads/main' && steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/cmdline-tools
            ${{ steps.sdk.outputs.root }}/platforms
            ${{ steps.sdk.outputs.root }}/build-tools
            ${{ steps.sdk.outputs.root }}/platform-tools
            ${{ steps.sdk.outputs.root }}/emulator
            ${{ steps.sdk.outputs.root }}/system-images
            ${{ steps.sdk.outputs.root }}/licenses
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}

      - name: Emulator packages
        run: |
          set -euo pipefail
          sudo apt-get update
          audio=""
          if apt-cache show libasound2t64 >/dev/null 2>&1; then
            audio=libasound2t64
          elif apt-cache show libasound2 >/dev/null 2>&1; then
            audio=libasound2
          fi
          # Qt 6's xcb plugin exits immediately when these are missing, and the
          # script then used to sit in adb wait-for-device until the job timeout.
          # qemu 37.2.12 NEEDs libpulse.so.0 even with -no-audio. Run 37884626225
          # exited at boot with "libpulse.so.0: cannot open shared object file".
          sudo apt-get install -y \
            xvfb libnss3 libxcomposite1 libxcursor1 libxi6 libxtst6 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libegl1 \
            libpulse0 libx11-6 \
            ${audio:+"$audio"}
          qemu="${ANDROID_HOME:-$HOME/android-sdk}/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          if [ -x "$qemu" ]; then
            missing="$(LD_LIBRARY_PATH="${ANDROID_HOME:-$HOME/android-sdk}/emulator/lib64:${ANDROID_HOME:-$HOME/android-sdk}/emulator/lib64/qt/lib" \
              ldd "$qemu" | awk '/not found/ { print }' || true)"
            if [ -n "$missing" ]; then
              echo "::error::The emulator binary is still missing shared libraries."
              printf '%s\n' "$missing"
              exit 1
            fi
          fi

      # Boot while Gradle builds. The script stops before install until the
      # APK marker appears, then runs the captures. The step below follows it.
      - name: Boot the emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/avd
          FOLDCADE_APK_READY: ${{ runner.temp }}/apk-ready
          FOLDCADE_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME" screenshots
          nohup bash .github/emulator/dual-screen.sh screenshots >"$RUNNER_TEMP/emulator-run.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/emulator-run.pid"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # The emulator does not listen to the loop. Reuse the last render of these exact
      # sources instead of installing fluidsynth and rendering on every run.
      - name: Restore rendered home music
        id: music-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/home-music
          key: home-music-render-${{ hashFiles('music/*.py', 'music/*.sh', 'music/requirements.txt', 'music/tracks/manifest.json', 'music/tracks/**/compose.py') }}

      - name: Render home music
        if: steps.music-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/render-home-music

      - name: Keep the render for the next run
        if: steps.music-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/home-music"
          cp -r app/build/generated/homeMusicAssets "$RUNNER_TEMP/home-music"

      - name: Use the rendered home music
        run: echo "ORG_GRADLE_PROJECT_foldcadeHomeMusicAssets=$RUNNER_TEMP/home-music" >> "$GITHUB_ENV"

      - name: Assemble debug
        run: |
          ./gradlew :app:assembleDebug --configuration-cache
          touch "$RUNNER_TEMP/apk-ready"

      - name: Dual-screen screenshots
        timeout-minutes: 15
        run: |
          set -euo pipefail
          pid="$(cat "$RUNNER_TEMP/emulator-run.pid")"
          # Replays what the boot printed while Gradle ran, then follows to the end.
          tail -n +1 --pid="$pid" -f "$RUNNER_TEMP/emulator-run.log"
          code="$(cat screenshots/exit-code 2>/dev/null || echo 1)"
          exit "$code"

      - name: Upload both displays
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dual-screen-displays-${{ matrix.shard }}
          path: screenshots/
          if-no-files-found: error
          retention-days: 7

      - name: Upload the emulator log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-log-${{ matrix.shard }}
          path: |
            screenshots/emulator.log
            screenshots/logcat.txt
            screenshots/failure.txt
          if-no-files-found: ignore
          retention-days: 7

  result:
    name: emulator result
    needs: [changes, screenshots]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Succeed when the emulator was skipped or passed
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          screenshots="${{ needs.screenshots.result }}"
          if [ "$changes" != "success" ]; then
            echo "::error::Path check result is ${changes}."
            exit 1
          fi
          case "$screenshots" in
            success|skipped) exit 0 ;;
          esac
          echo "::error::Emulator result is ${screenshots}."
          exit 1
