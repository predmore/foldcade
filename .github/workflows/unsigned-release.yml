name: Unsigned release

# Proves versionCode on pull requests and manual runs. Does not publish.
# This workflow has no signing secrets. The signed release is release.yml,
# which runs only on a push to main or a v0.x.y tag.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A cancelled dry-run must not be tied to the signed release concurrency group.
# cancel-in-progress stays false, matching the old job on the Release workflow.
concurrency:
  group: unsigned-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-release:
    name: unsigned release dry-run
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK root
        id: sdk
        run: echo "root=$HOME/android-sdk" >> "$GITHUB_OUTPUT"

      - name: Cache Android SDK packages
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.sdk.outputs.root }}/cmdline-tools
            ${{ steps.sdk.outputs.root }}/platforms
            ${{ steps.sdk.outputs.root }}/build-tools
            ${{ steps.sdk.outputs.root }}/platform-tools
            ${{ steps.sdk.outputs.root }}/licenses
          key: android-sdk-33-37.0-build-tools-37.0.0-platform-tools-v1

      - name: Install Android SDK packages
        env:
          SDK_ROOT: ${{ steps.sdk.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p "$SDK_ROOT"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            tmp="$(mktemp -d)"
            curl -fsSL -o "$tmp/cmdlinetools.zip" \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
            unzip -q "$tmp/cmdlinetools.zip" -d "$tmp"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$tmp/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          fi
          sdkmanager="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # sdkmanager closes stdin, so `yes` exits 141. Licenses are still accepted.
          yes | "$sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          # Do not install the legacy `tools` package. Current cmdline-tools do not ship it.
          # compileSdk is release(37), so compilation needs platforms;android-37.0.
          # platforms;android-33 is the min and target platform.
          "$sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-33" \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Same render step as the signed release job. No cross-workflow wait.
      # A healthy render takes about two minutes. Fail here instead of the job limit.
      - name: Render home music
        uses: ./.github/actions/render-home-music
        timeout-minutes: 10

      - name: Assemble unsigned release
        run: |
          set -euo pipefail
          code="$(git rev-list --count HEAD)"
          ./gradlew --configuration-cache \
            -PfoldcadeVersionCode="$code" \
            -PfoldcadeAllowUnsigned=true \
            :app:printFoldcadeIdentity :app:assembleRelease
          grep -qx "versionCode=${code}" app/build/foldcade-identity.txt
          mapfile -t apks < <(find app/build/outputs/apk/release -name '*.apk' -type f | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected one unsigned release APK, found ${#apks[@]}."
            printf '%s\n' "${apks[@]:-}"
            exit 1
          fi
          apk="${apks[0]}"
          unzip -l "$apk" | grep -q 'assets/music/lanternlight.ogg'
          unzip -l "$apk" | grep -q 'assets/music/manifest.json'
          if "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$apk"; then
            echo "::error::Unsigned dry-run produced a signed APK."
            exit 1
          fi
