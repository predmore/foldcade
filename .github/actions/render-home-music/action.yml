name: Render home music
description: Install the render tools, cache the pinned SoundFont, and render every track.

runs:
  using: composite
  steps:
    - name: Install fluidsynth and ffmpeg
      shell: bash
      run: |
        # fluidsynth recommends qsynth, and qsynth recommends fluid-soundfont-gm
        # (~130MB). This render loads MuseScore General instead. Installing those
        # recommendations made a slow Ubuntu mirror outlast the 30 minute job limit.
        sudo apt-get update
        sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          fluidsynth ffmpeg python3-venv libsndfile1

    - name: Cache MuseScore General SoundFont
      uses: actions/cache@v6
      with:
        path: ~/.cache/foldcade/MuseScore_General.sf3
        key: musescore-general-sf3-5b85b6c2c61d10b2b91cddd41efcce7b25cd31c8271d511c73afafbef20b6fa3

    - name: Render every track
      shell: bash
      run: ./gradlew :app:renderHomeMusic --configuration-cache
