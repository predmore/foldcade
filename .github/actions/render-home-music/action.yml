name: Render home music
description: Install the render tools from a cached deb set, cache the pinned SoundFont, and render every track.

runs:
  using: composite
  steps:
    # The debs are ~70 MB. Restoring them avoids apt on every release.
    # A miss still installs from the lockfile; the install script does not
    # leave that download to the Azure apt mirror.
    - name: Hash render package lock
      id: render-deb-key
      shell: bash
      run: |
        set -euo pipefail
        sum="$(sha256sum .github/actions/render-home-music/packages.lock)"
        sum="${sum%% *}"
        echo "key=ubuntu-24.04-home-music-debs-${sum}" >> "$GITHUB_OUTPUT"

    - name: Restore cached render packages
      id: render-debs
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/foldcade/render-debs
        key: ${{ steps.render-deb-key.outputs.key }}

    - name: Install fluidsynth and ffmpeg
      shell: bash
      run: .github/actions/render-home-music/install-tools.sh

    - name: Save cached render packages
      if: steps.render-debs.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/foldcade/render-debs
        key: ${{ steps.render-deb-key.outputs.key }}

    - name: Cache MuseScore General SoundFont
      uses: actions/cache@v6
      with:
        path: ~/.cache/foldcade/MuseScore_General.sf3
        key: musescore-general-sf3-5b85b6c2c61d10b2b91cddd41efcce7b25cd31c8271d511c73afafbef20b6fa3

    - name: Render every track
      shell: bash
      run: ./gradlew :app:renderHomeMusic --configuration-cache
